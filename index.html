            showAssetDetail(id) {

                this.openModal(`Detail Asset: ${asset.name}`, `
                    <div class="space-y-4 text-xs text-slate-300">

            exportData(type) {
                this.showNotification(`File ${type} berhasil diexport (CSV/Excel/PDF ready)!`, 'success');

            showNotification(message, type='success') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = `pointer-events-auto bg-slate-800 border ${type === 'success' ? 'border-emerald-500 text-emerald-400' : 'border-red-500 text-red-400'} px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 text-xs font-semibold animate-bounce`;
                toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'} text-base"></i><span>${message}</span>`;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }

            setupEventListeners() {
                document.getElementById('sidebar-toggle').addEventListener('click', () => this.toggleSidebar());
            }
